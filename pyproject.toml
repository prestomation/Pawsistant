[project]
name = "pawsistant"
version = "2.4.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "requests>=2.31"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_ha: marks tests that use real HA modules (not mocked)",
]

[tool.coverage.run]
branch = true
source = ["custom_components/pawsistant"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
# Keep ruff's default rules and add the async rules. ASYNC finds blocking
# calls (open, time.sleep, requests, Path methods) inside "async def". It does
# not find a Path built with "/", so it is a weak guard. The blockbuster
# fixture in tests/conftest.py is the real guard.
extend-select = ["ASYNC"]
