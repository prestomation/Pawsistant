homeassistant:
  name: Test Home
  unit_system: imperial
  time_zone: America/New_York
  latitude: 40.7128
  longitude: -74.0060
  elevation: 10

# Enable the REST API
api:

# Enable frontend (pulls in lovelace as a dependency)
frontend:

# NOTE: there is deliberately no `lovelace:` block here.
#
# Declaring one used to give the suite a YAML dashboard preloaded with the
# Pawsistant cards, which meant e2e never exercised the setup a real user has:
# Lovelace left at its default (storage mode, no YAML dashboards), with the card
# reaching the browser only via the resource the integration registers itself.
# The e2e dashboard is now a seeded storage fixture instead — see
# .storage/lovelace_dashboards and .storage/lovelace.pawsistant_e2e, which are
# byte-for-byte what HA writes when a user adds a dashboard through
# Settings -> Dashboards and puts the cards on it.

# Minimal logging
logger:
  default: info
  logs:
    custom_components.pawsistant: debug
